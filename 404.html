<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Página no encontrada · Abogada Jalenska Zurakoski Luparelli</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#052c29">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=DM+Sans:wght@300&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
:root{--deep:#052c29;--mint:#77d6ad;--white:#f8f7f2;--serif:"Playfair Display",Georgia,serif;--sans:"DM Sans",system-ui,Arial,sans-serif;--mono:"DM Mono",ui-monospace,monospace}
*{box-sizing:border-box}html,body{overflow-x:clip}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;color:var(--white);font-family:var(--sans);font-weight:300;background:radial-gradient(circle at 75% 30%,rgba(119,214,173,.14),transparent 28%),linear-gradient(120deg,#021816,var(--deep))}
a{color:inherit}:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
header{padding:22px 20px}
.logo{width:130px;height:auto;filter:brightness(0) invert(1)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;width:min(820px,100% - 40px);margin:0 auto;padding:40px 0 80px}
.eyebrow{font:400 10px var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--mint)}
.code{font:400 clamp(90px,22vw,200px)/.8 var(--serif);color:rgba(119,214,173,.25);margin:18px 0 0}
h1{font:400 clamp(34px,6vw,60px)/1 var(--serif);letter-spacing:-.03em;margin:20px 0 16px}
p{font-size:16px;line-height:1.6;color:#cfd8d2;max-width:460px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-height:50px;padding:0 24px;margin-top:32px;background:var(--mint);color:var(--deep);text-decoration:none;font:400 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;transition:transform .3s}
.btn:hover{transform:translateY(-2px)}
@media(min-width:1024px){header{padding:28px 5vw}.logo{width:145px}}
</style>
</head>
<body>
<header><a href="/" aria-label="Ir al inicio"><img class="logo" src="/assets/logo.webp" alt="Jalenska Zurakoski Luparelli" width="145" height="48"></a></header>
<main>
  <div class="eyebrow">Error 404</div>
  <div class="code" aria-hidden="true">404</div>
  <h1>Esta página no existe.</h1>
  <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
  <a class="btn" href="/">Volver al inicio</a>
</main>
</body>
</html>
